  utter_summary_sarah_mae_flemmings_city:
  - text: Sarah Mae Flemming's case was most significant because it laid the groundwork
      for making segregation on public transit illegal. Although Flemming's lawsuit
      was orignally unsuccessful, through the efforts of the NAACP, the case was appealed
      and led to city bus segregation being deemed illegal and unconstitutional. This
      ruling would later be used as both the inspiration and precedent for Rosa Parks
      and the Montogmery Bus Boycott, as well as similar cases, that would eventually
      lead to the further desegregation of public transit across the country.
