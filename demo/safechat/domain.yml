  utter_summary_naacp_established_religious_organization:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13586/rec/2; Date: ] The NAACP was not established a religious organization but was rather a social and political activist group designed to combat racial discrimination and violence. Despite not being a religious organization, the NAACP did have close ties to the church which has long held a central place in Black communities. The NAACPs ties to religious groups can be seen through the organization using religious language to describe the fight for civil rights; frequent events held at churches; and the prevalence of leaders within the group who had strong religious affiliations.
    
