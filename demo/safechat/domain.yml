  utter_summary_sc_state_conference_naacp:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13586/rec/2; Date: ] During the 1940s and 50s, the SC State Conference of the NAACP played a significant role in securing legal rights in voting, education, employment, and personal protection for Black South Carolinians. Some of the most notable victories during this period included securing equal pay for Black teachers (Duval v. School Board), creating Black access to the Democratic Primary (Elmore v. Rice and Brown v. Baskin), and the creation of a law school at South Carolina State University (Wright v. Board of Trustees). During this period, the SC State Conference also led the Sarah Mae Flemming bus case which helped establish segregation on city buses as unconstitutional. While not every case resulted in a clear victory, the State Conference’s sustained activism still produced lasting change.
    
  utter_sc_state_conference_naacp:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13586/rec/2; Date: ] During the 1940s and 50s, the SC State Conference of the NAACP played a significant role in securing legal rights in voting, education, employment, and personal protection for Black South Carolinians. Some of the most notable victories during this period included securing equal pay for Black teachers (Duval v. School Board), creating Black access to the Democratic Primary (Elmore v. Rice and Brown v. Baskin), and the creation of a law school at South Carolina State University (Wright v. Board of Trustees). During this period, the SC State Conference also led the Sarah Mae Flemming bus case which helped establish segregation on city buses as unconstitutional. While not every case resulted in a clear victory, the State Conference’s sustained activism still produced lasting change.
    
  utter_summary_sarah_mae_flemmings_city:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/1448/rec/10,https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13586/rec/2; Date: ] Sarah Mae Flemmings case was most significant because it laid the groundwork for making segregation on public transit illegal. Although Flemmings lawsuit was orignally unsuccessful, through the efforts of the NAACP, the case was appealed and led to city bus segregation being deemed illegal and unconstitutional. This ruling would later be used as both the inspiration and precedent for Rosa Parks and the Montogmery Bus Boycott, as well as similar cases, that would eventually lead to the further desegregation of public transit across the country.
    
