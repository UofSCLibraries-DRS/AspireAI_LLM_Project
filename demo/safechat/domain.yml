      \ directly accountable to the people they served\n+ supporting sum clearance\n\
      + increasing housing and enforcing strict cleaning and maintenance projects\
      \ throughout the city\n+ increasing salaries and enforcing hiring guidelines\n\
      + decreasing crime\n+ creating more recreation spaces and daycares in low-income\
      \ neighborhoods"
  utter_scenario_simkins_9ff6f6ebc8f9:
