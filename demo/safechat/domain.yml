  utter_summary_necessary_john_mccray_organize:
  - text: It was necessary for John McCray to help organize the Progressive Democratic
      Party because the South Carolina Democratic Party (PDP) operated as a private
      club that prohibited Black participation in its conventions and primaries. Thus,
      the PDP was created to provide Black South Carolinians with opportunities for
      political participation, and to expose the official state party's discriminatory
      practices. Additionally, the work of the PDP also helped to organize the court
      case Elmore v. Rice, which successfully challenged South Carolina's all-white
      primary system.
