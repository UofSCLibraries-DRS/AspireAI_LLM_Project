  utter_scenario_simkins_02cbc8fb4574:
  - text: Yes, Strom Thurmond opposed the Civil Rights Act of 1957.
  utter_scenario_simkins_2268324e05ec:
  - text: Through the mid-1960s, there were no "fair dismissal" laws on the books
      in most Southern states. This meant that many Black teachers were vulnerable
      to being fired for their particpation in the Civil Rights Movement, as firing
      and other forms of intimidation were often used as tools to disuade civil rights
      activities. Thus, these teachers needed legal protections to ensure they could
      not be fired for their activism.
  utter_scenario_simkins_fafab07de1cb:
  - text: Participation in the Civil Rights Movement throughout the South was accompanied
      by numerous risks. Activists often experienced physical violence, job loss,
      imprisonment, and economic hardship as all of these things were used as tools
      to stop the Movement.
  utter_scenario_simkins_e9315f7445bb:
  - text: According to her 1958 letter, Simkins believed that the State NAACP was
      doing an insufficient job of helping Black desegregate the University of South
      Carolina at the time. She claimed that the State NAACP used questions about
      student eligibility and the possibility of economic reprisal as excuses for
      not helping student-initated desegregation efforts. She also claimed that the
      State NAACP was hesitant to help because students did not consult to organization
      first before attempting the desegregation process.
  utter_scenario_simkins_2287f06f87a3:
  - text: According to Simkins, Strom Thurmond opposed the Civil Rights Acts of 1957,
      1960, and 1964, as well as the Voting Rights Act of 1965. Thurmond also actively
      attempted to end the Voting Rights Act of 1965 which Simkins believed was an
      intentional plot to disenfranchise Black voters. She ultimately believed that
      Thurmond was a strong opponent of racial progress and that pro-Strom votes were
      a strong indicator of the racial progress that still needed to be made in South
      Carolina.
  utter_scenario_simkins_74ecfbb22c45:
  - text: Over the course of her lifetime, Simkins held leadership positions in a
      number of organizations that championed Black progress in South Carolina including
      the NAACP, Victory Savings Bank,Good Samaritan-Waverly Hospital, the Richland
      County Citizens Committee, and the Southern Conference Educational Fund. In
      these roles, she supported the Civil Rights Movementthrough improving voter
      registration, increasing access to better health care, encouraging desegregation,
      and financially supporting Black citizens who experienced economic reprisal
      for their activism.
  utter_scenario_simkins_903419bde0f3:
  - text: The Richland County Citizens Committee, Inc. was organized in 1944.
  utter_scenario_simkins_13f364c20da5:
  - text: The organization was located at 2025 Marion Street in Columbia, SC in 1972.
  utter_scenario_simkins_177f53332abc:
  - text: Yes, Simkins wrote to the Richland County Council about hiring discrimination
      at the hospital in 1972.
  utter_scenario_simkins_06b2956e9e7f:
  - text: The RCCC was chartered in 1956.
  utter_scenario_simkins_9beeec6a6d85:
  - text: In 1972, Simkins served as a director of the RCCC.
  utter_scenario_simkins_f5f6f49a94ee:
  - text: The RCCC received numerous reports of employment discrimination at Richland
      Memorial Hospital. These included efforts to intentionally limit the number
      of Black employees and to force others who had already been hired to leave the
      hospital. After investigating these claims, and finding the hospital to be in
      violation of the Equal Protection Clause of the 14th Amendment, members of the
      RCCC appealed to the County Council for assistance in rectifying these issues.
      They also highlighted other administrative failings at the hospital that were
      contributing to these problems including the hiring of unqualified administrators
      who often lacked adequate education and experience.
  utter_scenario_simkins_f16e8fc601e3:
  - text: The RCCC supported voting efforts in the Black community by publicizing
      voting dates, encouraging voting and registration, reminding citizens of the
      power of voting, assigning members to offer support at the polls, reminding
      voters of their rights, and providing clear directions on how to participate
      in the voting process. In addition, the organization also used a “Tell Ten to
      Tell Ten” method that encouraged citizens to spread news about voting dates
      and the significance of voting throughout the community. They also regularly
      discussed voting efforts on the RCCC radio broadcast to spread voting information
      to the broadest group possible.
  utter_scenario_simkins_f18de9475fe5:
  - text: RCCC broadcasts regularly talked about the challenges that Black citizens
      faced in the areas of education, health, politics, and equal rights. Through
      their platform, they not only publicized these issues to ensure they were not
      overlooked by the broader public but also regularly offered advice and support
      in order to rectify them. The RCCC actively encouraged listeners to partner
      in their own liberation and reminded them of their constitutional rights as
      fellow Americans.
  utter_scenario_simkins_5eeb7a6497c1:
  - text: "In statements and reports issued by the RCCC, members stated that evidence\
      \ of the harm of public park segregation was apparent through the city:\n+ failing\
      \ to provide adequate programming for Black youth\n+ neglecting to hire and\
      \ train qualified individuals to manage Black parks\n+ disregarding the need\
      \ for adminstrative supplies to operate Black parks\n+ contributing to the division\
      \ of funds necessary to maintain a segregated park system which led to all parties\
      \ being surved insufficiently by taxpayer money"
  utter_scenario_simkins_97ca23f85b30:
  - text: Yes, in addition to uplifting Columbia's Black population through supporting
      progress in health, employment, political power, and education, the RCCC also
      encouraged members of the Black population to improve themselves by making wiser
      financial decisions, dressing in a "respectable" manner, and avoiding "vulgar"
      language.
  utter_scenario_simkins_90a121a17286:
  - text: Victory Savings Bank was founded in 1921.
  utter_scenario_simkins_0517fcc17976:
  - text: No, Simkins was not the sole founder of Victory Savings Bank.
  utter_scenario_simkins_dced5d8ad204:
  - text: Yes, the Board of Directors for the bank met on February 11, 1988.
  utter_scenario_simkins_168b6267e16f:
  - text: On February 11, 1988, the Victory Savings Bank Board of Directors met at
      5:30pm.
  utter_scenario_simkins_786209313b25:
  - text: Yes, Tim McConnell was a director of Victory Savings Bank in 1988.
  utter_scenario_simkins_53726a45f088:
  - text: The Board of Directors primarily called a special meeting to propose the
      creation of additional stock in the bank. Additionally, the meeting was used
      to create a plan for settling the bank's legal fees and to both fire the old
      president of the organization and hire a new one.
  utter_scenario_simkins_5d05f26f912e:
  - text: At the time of the meeting, Victory Savings Bank was contending with having
      insufficient funds for the organization's operations. The creation of 50,000
      more shares of stock was intended to increase the amount of capital within the
      bank to help fix this problem.
  utter_scenario_simkins_4f530576f7f8:
  - text: The State Conference of the NAACP and Victory Savings Bank had a longstanding
      partnership for decades. The State Conference not only banked with Victory Savings
      Bank, but also placed several deposits in the organization in order to support
      Black citizens who experienced economic reprisals during the Civil Rights Movement.
  utter_scenario_simkins_4f37595e7e5d:
  - text: In the 1950s, citizens throughout South Carolina signed petitions demanding
      the desegregation of public schools. In an act of economic reprisal, and under
      the leadership of the Whitie Citizens Counsel, many white institutions began
      denying Black access to traditional lending services. The response created an
      economic freeze in Black communities that impacted Clarendon, Organeburg, and
      Sumter counties especially hard. Through these hardships, Victory Savings Banks
      remained as an instituion that Black citizens could continue to bank with. Beyond
      this, the organization managed deposits from numerous religious, private, and
      civic organizations that were used to establish a relief fund for those who
      were being economically repressed.
  utter_scenario_simkins_df9e2f4f362c:
  - text: Chartered in 1921, Victory Savings Bank was the only bank owned and operated
      by Black people in South Carolina. The bank was well-known among the community
      for provding banking services for Black citizens and other marginalized groups
      who were traditionally denied support through white instituitons. Addtionally,
      following the economic reprisals in the 1950s that were used to intimidate Black
      community members seeking school desegresgation, Victory Savings Bank served
      as deposit center for relief funds to support the effected individuals.
  utter_scenario_simkins_21ca15cbf785:
  - text: The acronym "ACLU" stands for "American Civil Liberties Union."
  utter_scenario_simkins_16dc62c0c72b:
  - text: Yes, Simkins was on the ACLU Board of Directors.
  utter_scenario_simkins_dd8e330f45d0:
  - text: A basic, individual ACLU membership cost $20 in 1984.
  utter_scenario_simkins_f46d836f7be6:
  - text: No, the ACLU life membership was $1000 in 1984.
  utter_scenario_simkins_49585334645f:
  - text: Yes, the executive director of the ACLU corresponded with Simkins on July
      18, 1984.
  utter_scenario_simkins_af1b0fab936b:
  - text: The ACLU was not only historically opposed to the death penalty but also
      actively sought to repeal it. In 1984, the South Carolina branch of the ACLU
      participated in the S.C. Coalition Against the Death Penalty conference which
      served as an opportunity for individuals and organizations across the state
      to join efforts and fight for the end of capital punishment. The organization
      has continued to oppose the death penalty for several decades.
  utter_scenario_simkins_eac7531a668b:
  - text: Because the ACLU viewed pornography as a type of speech, members of the
      organization opposed actions to restrict it, citing First Amendment rights.
      The organization believed that if pornographic expression were restricted, this
      could lead to further limitations on freedom of speech as a whole and set a
      precedent for censoring certain forms of creative expression like film and art
      that also sometimes depict controversial subject matter.
  utter_scenario_simkins_95aec2617364:
  - text: The SC ACLU was a small group in the late 1970s. During this time, the group's
      annual budget was merely $13,000 and it had no structured programming. Under
      the leadership of director Melissa Metcalfe, by 1984, the organization had increased
      its annnual budget to $40, 000. Additionally, the organization was able to hire
      a staffing team with one full-time employee and to produce publications, scholarships,
      and seminars in addition to supporting legal battles and state-wide activism.
  utter_scenario_simkins_cde147f73c3d:
  - text: In the mid-1980s, the SC ACLU was unable to afford a staff lawyer. As a
      result, the organization relied upon the Madama Fellowship to provide funds
      for hiring a law student intern who could assist with legal concerns. This intern
      was tasked with conducting case research, writing complaints and briefs, and
      seeking advice from more established legal counsel. Through these processes,
      the intern could help the local ACLU to resolve many legal issues, often without
      going to court.
  utter_scenario_simkins_77a650b7fd5e:
  - text: Dwight Newton became the treasurer for the SC ACLU in 1980. Within three
      years of the position, Newton most notably helped the organization to solve
      many of its financial challenges and recover from the threat of bankruptcy.
      Additionally, Newton, who was known for his compassion, grit, and enthusiam,
      also helped start a new chapter of the ACLU in South Carolina and worked directly
      with families to help them secure their civil rights.
  utter_scenario_simkins_7c7ec9bce5ba:
  - text: Yes, Simkins was the Campaign Director for the renovation of the hospital.
  utter_scenario_simkins_1b24795fd562:
  - text: Yes, Good Samaritan-Waverly Hospital was created from a merger between Good
      Samaritan Hospital and Waverly Hospital.
  utter_scenario_simkins_1d1edc587302:
  - text: Good Samaritan-Waverly Hospital was established on the site of Waverly Hospital
      in Columbia, SC.
  utter_scenario_simkins_da1c91c8291e:
  - text: Yes, for many years the hospital was segregated and served the county's
      Black population.
  utter_scenario_simkins_a0cef734a1e6:
  - text: The hospital sought to raise $100,000 to renovate the organization's facilities.
  utter_scenario_simkins_85018dc57b3b:
  - text: Prior to the establishment of the Good Samaritan-Waverly Hospital in the
      late 1930s, there were limited medical services available to Black citizens
      in Richland County. The merger of two existing, smaller Black hospitals would
      thus allow Black medical professionals to combine their expertise, training
      programs, and other resources in order better serve the local Black public in
      the midst of segregation.
  utter_scenario_simkins_d1d30464e6ce:
  - text: In the 1940s and 50s, Modjeska Simkins served as the Campaign Director for
      the renovation of Good Samaritan-Waverly hospital. Under her leadership, the
      hospital raised nearly $100,000 to provide necessary improvements to the hospital's
      services. In the aftermath of the renovations, Simkins continued to promote
      the value of the hospital to Black citizens by encouraging them to continue
      to support and attend this hospital that had met many of their medical needs
      over the previous decades, especially during the height of segregation.
  utter_scenario_simkins_d47c4124f3f3:
  - text: The Good Samaritan-Waverly Hospital helped improve healthcare for Black
      residents of Richland County, and surrounding counties, by training Black nurses,
      employing Black medical professionals, and providing life-saving treatment for
      Black citizens who were denied access to "white-only" hospitals. In addition
      to housing 50 beds for patients, the hospital also possessed a pharmacy, laboratory,
      an X-ray room, and operating rooms - offering a full range of services to Black
      patients throughout the region.
  utter_scenario_simkins_6c746a10c119:
  - text: The necessary funds to renovate Good Samaritan-Waverly Hospital took years
      to accumulate. That said, under the leadership of Modjeska Simkins, the organization
      raised tens of thousands of dollars for the renovations by organizing local
      fundraising drives, soliciting door to door, and encouring local churches, business,
      organizations, and individuals to give towards the hospitals mission. The majority
      of the funds were the result of small donations from these parties which attests
      to just how many people gave to the cause.
  utter_scenario_simkins_13cce19ec26a:
  - text: Good Samaritan-Waverly Hospital had long struggled financially, even before
      its closure in the 1970s. Many hospitals throughout the area regularly sent
      Black patients to the hospital but refused to reimburse the institution for
      the vital services it provided. In the aftermath of desegregation, Black patients
      both chose to attend and were diverted to recently integrated hospitals and
      away from Good Samaritan-Waverly Hospital, which was a historically Black institution.
      In the era of intergration, the hospital also struggled to attract white patients
      depsite being open to all. This dwindling attendance ultimately forced the hospital
      to close its doors in 1973.
