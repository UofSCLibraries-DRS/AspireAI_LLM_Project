  utter_summary_challenge_naacp_chapter_face:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13586/rec/2; Date: ] Members of the NAACP faced a number of challenges in their fight for equality including failed court cases, job loss, economic reprisals, and physical hardships. Retaliation against members of the NAACP was rampant in South Carolina, especially impacting Black citizens in Orangeburg, Sumter, Clarendon County, and Columbia who had known connections with the organization. Despite these challenges, Black members of churches, financial institutions, and the community all banded together to support the activists who were being antagonized for their civil rights efforts.
    
