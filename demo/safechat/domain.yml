  utter_summary_sc_state_conference_naacp:
  - text: During the 1940s and 50s, the SC State Conference of the NAACP played a
      significant role in securing legal rights in voting, education, employment,
      and personal protection for Black South Carolinians. Some of the most notable
      victories during this period included securing equal pay for Black teachers
      (Duval v. School Board), creating Black access to the Democratic Primary (Elmore
      v. Rice and Brown v. Baskin), and the creation of a law school at South Carolina
      State University (Wright v. Board of Trustees). During this period, the SC State
      Conference also led the Sarah Mae Flemming bus case which helped establish segregation
      on city buses as unconstitutional. While not every case resulted in a clear
      victory, the State Conference’s sustained activism still produced lasting change.
