  utter_summary_john_mccray_enjoy_working:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/10745/rec/7; Date: ] John McCray believed that his work with The Lighthouse and Informer was important, especially because it gave him a platform to share social and political insights about the Black community in South Carolina. McCray was confident in his work, and remained committed to the newspaper even when his work for the paper caused distress in his personal life. McCray worked for the newspaper for 15 years but ultimately left due to disagreements over compensation, creative license, and management practices.
    
  utter_john_mccray_enjoy_working:
