  utter_summary_john_mccray_enemy:
  - text: |
      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/10745/rec/7 and McCray (1940s, 100 transcript subset) Original Index #2538; Date: ] Yes, John McCray had enemies. His collection reflects that he had several conflicts over the course of his life. He often clashed with white Democrats, white supremacists, other journalists, and fellow activists. McCray had a well-known feud with fellow activist, Modjeska Simkins. He was also implicated in gossip surrounding The Lighthouse and Informer.
    
  utter_john_mccray_enemy:
