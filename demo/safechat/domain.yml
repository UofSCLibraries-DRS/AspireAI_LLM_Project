      [Source: https://digital.tcl.sc.edu/digital/collection/p17173coll38/id/13583/rec/2; Date: ] The relationship between the National Office of the NAACP and the SC State Conference of the NAACP was largely positive and collaborative. While the SC State Conference of Branches paid for most of their legal cases through local fundraising efforts, the National Office also hired and paid for civil rights lawyers who helped SC NAACP chapters secure important civil rights victories.
    
  utter_relationship_like_sc_state:
