  utter_scenario_simkins_0f611d7aeb21:
  - text: Simkins was asked to leave the Democratic Party by Robert McNair, Earle
      E. Morris, and T. Easton Merchant if she was unable to disprove her association
      with the renowned Marxist, Herbert Aptheker. They believed that Marxist ideals
      were "un-American" and conflicted with the values of the Democratic Party of
      South Carolina.
  utter_scenario_simkins_72727eae1066:
  - text: Though Simkins had only met Aptheker twice by the late 1960s, she remained
      an admirer of his human and civil rights efforts. The pair first met during
      WW2 at Ft. Jackson in Columbia, SC. More than 20 years later, Simkins was asked
      to give a speech to honor his work. Though unable to attend, Simkins wrote a
      letter to praise the civil and human rights work of Apetheker, and to commend
      him for his extensive writing on African Americanl ife and culture. At the time
      of her letter, Simkins believed that Apetheker wrote about African American
      history in a way that was far more accurate than other historians at the time.
