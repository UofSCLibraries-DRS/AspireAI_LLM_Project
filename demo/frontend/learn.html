<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }

    h1 {
      color: #73000a;
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 2px solid #73000a;
    }

    p {
      margin-bottom: 20px;
      font-size: 16px;
      text-align: justify;
    }

    a {
      color: #73000a;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    a:hover {
      color: #a30010;
      text-decoration: underline;
    }

    .back-button {
      display: inline-block;
      background-color: #73000a;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .back-button:hover {
      background-color: #a30010;
      color: white;
      text-decoration: none;
    }
  </style>
  <!-- go back link -->
  <a href="index.html" class="back-button">← Back to Chatbot</a>

  <h1>About This Project</h1>
  <p>This project is a chatbot that helps users find information from the University of South Carolina's digitized
    special collections.
  </p>
  <p>The chatbot is hosted on AWS and is available 24/7.</p>
  <p>More information coming soon...</p>
</body>

</html>
