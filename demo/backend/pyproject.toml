[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "boto3>=1.42.42",
    "dotenv>=0.9.9",
    "fastapi>=0.128.1",
    "gunicorn>=25.0.1",
    "openai>=2.19.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "torch>=2.10.0",
    "transformers>=5.1.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
    "uvicorn>=0.40.0",
]

[tool.pyrefly]
# Application modules are imported as `src.api...`, so resolve project imports
# from this directory rather than applying Pyrefly's default `src/` heuristic.
search-path = ["."]
