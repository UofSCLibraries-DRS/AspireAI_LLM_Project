# Llama 3.1 Instruct user/assistant format without an added system message.
# Quoted newlines preserve the two newlines after each role header.
template: "<|begin_of_text|><|start_header_id|>user<|end_header_id|>\n\n{user_prompt}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n"
template_stop: "<|eot_id|>"
stop_sequences:
  - "<|eot_id|>"
  - "<|end_of_text|>"
  - "<|start_header_id|>"
